<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Invite Link Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Marcellus&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Cormorant Garamond',serif;color:#fff6ea;text-align:center;
    background:linear-gradient(180deg,#5c0a14 0%,#7a0c1e 50%,#5c0a14 100%);
    min-height:100vh;padding:40px 20px;
  }
  .box{max-width:480px;margin:0 auto;border:1px solid rgba(217,164,65,.5);border-radius:14px;padding:30px 22px}
  h1{font-family:'Marcellus',serif;font-size:1rem;letter-spacing:.28em;text-transform:uppercase;color:#d9a441;margin-bottom:6px}
  p.hint{font-style:italic;color:#ffe9c9;margin-bottom:22px}
  input{
    width:100%;padding:13px 16px;font:inherit;font-size:1.15rem;text-align:center;
    color:#fff6ea;background:rgba(0,0,0,.25);border:1px solid rgba(217,164,65,.6);border-radius:10px;outline:none;
  }
  .link{
    margin-top:18px;padding:12px;font-size:.85rem;word-break:break-all;
    background:rgba(0,0,0,.25);border-radius:10px;color:#f0cf8a;min-height:44px;
  }
  .row{display:flex;gap:10px;justify-content:center;margin-top:16px}
  button,a.share{
    font-family:'Marcellus',serif;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
    padding:12px 20px;border-radius:999px;cursor:pointer;text-decoration:none;
    border:1px solid #d9a441;background:transparent;color:#f0cf8a;
  }
  a.share{background:linear-gradient(180deg,#f0cf8a,#d9a441);color:#5c0a14;border:none}
  .copied{color:#8fdc9a;font-size:.9rem;margin-top:10px;min-height:1.2em}
</style>
</head>
<body>
  <div class="box">
    <h1>Guest Link Maker</h1>
    <p class="hint">Type a guest or family name — get their personalized invite link.</p>
    <input id="name" placeholder="e.g. Sharma Family" autofocus>
    <div class="link" id="link">—</div>
    <div class="row">
      <button id="copy" type="button">Copy Link</button>
      <a class="share" id="wa" href="#" target="_blank" rel="noopener">Send on WhatsApp</a>
    </div>
    <p class="copied" id="msg"></p>
  </div>
<script>
  var base = location.origin + '/';
  var name = document.getElementById('name'), link = document.getElementById('link'),
      wa = document.getElementById('wa'), msg = document.getElementById('msg');
  function update(){
    var n = name.value.trim();
    var url = n ? base + '?guest=' + encodeURIComponent(n) : base;
    link.textContent = url;
    wa.href = 'https://wa.me/?text=' + encodeURIComponent(url);
  }
  name.addEventListener('input', update); update();
  document.getElementById('copy').addEventListener('click', function(){
    navigator.clipboard.writeText(link.textContent).then(function(){
      msg.textContent = 'Copied!'; setTimeout(function(){ msg.textContent = ''; }, 1500);
    });
  });
</script>
</body>
</html>
